<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>3D rotating carousel</title>
</head>
<body>
    <div class="container">
        <div class="carousel carousel_1">
            <div class="item item_1">Item 1</div>
            <div class="item item_2">Item 2</div>
            <div class="item item_3">Item 3</div>
            <div class="item item_4">Item 4</div>
            <div class="item item_5">Item 1</div>
            <div class="item item_6">Item 6</div>
        </div>
        <div class="carousel carousel_2">
            <div class="item item_1">Item 1</div>
            <div class="item item_2">Item 2</div>
            <div class="item item_3">Item 3</div>
            <div class="item item_4">Item 4</div>
            <div class="item item_5">Item 1</div>
            <div class="item item_6">Item 6</div>
        </div>
        <div class="carousel carousel_3">
            <div class="item item_1">Item 1</div>
            <div class="item item_2">Item 2</div>
            <div class="item item_3">Item 3</div>
            <div class="item item_4">Item 4</div>
            <div class="item item_5">Item 1</div>
            <div class="item item_6">Item 6</div>
        </div>
        <div class="carousel carousel_4">
            <div class="item item_1">Item 1</div>
            <div class="item item_2">Item 2</div>
            <div class="item item_3">Item 3</div>
            <div class="item item_4">Item 4</div>
            <div class="item item_5">Item 1</div>
            <div class="item item_6">Item 6</div>
        </div>
    </div>
</body>
</html>
