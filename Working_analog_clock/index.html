<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Working analog clock</title>
</head>
<body>
    <div class="clock">
        <div class="numbers">
            <span style="--i:0;"><b>12</b></span>
            <span style="--i:1;"><b>3</b></span>
            <span style="--i:2;"><b>6</b></span>
            <span style="--i:3;"><b>9</b></span>
            <div class="circle" id="hr"><i id="hr2"></i></div>
            <div class="circle" id="mn"><i id="mn2"></i></div>
            <div class="circle" id="sc"><i id="sc2"></i></div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
